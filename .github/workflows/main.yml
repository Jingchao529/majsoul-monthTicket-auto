name: Login to Majsoul

on:
  schedule:
    - cron: '5 21 * * *'  # 21:05 UTC = 05:05 Beijing time
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false      # one account failing does not cancel the others
      max-parallel: 1       # log in accounts one at a time
      matrix:
        n: [1, 2, 3, 4, 5]  # account slots; empty slots are skipped
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm ci

    - name: Claim month ticket (account ${{ matrix.n }})
      run: |
        if [ -z "$EMAIL" ] && [ -z "$UID" ]; then
          echo "No secrets for account ${{ matrix.n }}, skipping."
          exit 0
        fi
        npm start
      env:
        MS_SERVER: ${{ secrets.MS_SERVER }}
        EMAIL: ${{ secrets[format('EMAIL_{0}', matrix.n)] }}
        PASSWORD: ${{ secrets[format('PASSWORD_{0}', matrix.n)] }}
        UID: ${{ secrets[format('UID_{0}', matrix.n)] }}
        TOKEN: ${{ secrets[format('TOKEN_{0}', matrix.n)] }}

  keep-alive:
    needs: run-script
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Update Keep-Alive File
      run: |
        echo "Last run: $(date)" > keep_alive.txt
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add keep_alive.txt
        git commit -m "Keep-alive: Update timestamp"
        git push
